<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questlog · Job tracker</title><link rel="stylesheet" href="./style.css"><script src="./tracker.js" defer></script></head>
<body><main><header><a href="../#/other-projects">← Brandon Moss · Portfolio</a><a href="https://github.com/bmoss3211/bmoss3211.github.io/tree/main/questlog">Source code ↗</a></header>
<section class="hero"><div class="pixel" aria-hidden="true">▦</div><h1>Questlog</h1><p>A job tracker for game developers</p></section>
<div class="heading"><div><h2>Application pipeline</h2><p>Explore fictional roles or add your own. Changes are saved in this browser.</p></div><button id="add">+ Add role</button></div>
<p id="counts" aria-live="polite"></p>
<details><summary>Résumé vault</summary><p>Save a résumé version and reusable experience notes in this browser.</p>
<form id="vault"><label>Version name <input name="version" required></label> <label>Experience notes <textarea name="snippet" required></textarea></label> <button>Save version</button></form><ul id="versions"></ul></details>
<div class="controls"><label>Search <input id="search" type="search" placeholder="Company, role or keyword"></label><label>Stage <select id="stage"><option>All stages</option></select></label><label>View <select id="view"><option>Board</option><option>Table</option><option>Compare</option></select></label><label>Focus <select id="focus"><option>All roles</option><option>UEFN / Verse</option><option>Unity C#</option><option>Other</option></select></label><label><input type="checkbox" id="hide"> Hide expired</label></div><div id="output"></div><p role="status" id="notice"></p>
<dialog><form><h2>Application details</h2><div id="fields"></div><label>Use saved résumé <select id="reuse"><option value="">Choose a version</option></select></label><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button>Save role</button></div></form></dialog>
</main></body></html>
